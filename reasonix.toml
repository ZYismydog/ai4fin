[permissions]
allow = ["Bash=python -c \"\nimport re\nt = open('%TEMP%/report_section.txt', encoding='utf-8').read()\n# 去除空白后的总字符数\ntotal = len(re.sub(r'\\s', '', t))\n# 仅中文字符数\ncn = len(re.findall(r'[\\u4e00-\\u9fff]', t))\nprint('总字符数(不含空白):', total)\nprint('中文字符数:', cn)\nprint('段落数:', len([p for p in t.split(chr(10)) if p.strip()]))\n\"", "Bash=python -X utf8 -c \"\nimport re,io,sys\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\nt = open(r'%TEMP%/report_section.txt', encoding='utf-8').read()\ntotal = len(re.sub(r'\\s', '', t))\ncn = len(re.findall(r'[\\u4e00-\\u9fff]', t))\nprint('total chars (no ws):', total)\nprint('chinese chars:', cn)\n\"", "Bash=python -X utf8 -c \"\nimport re,io,sys\nsys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8')\nt = open(r'%TEMP%/report_section3.txt', encoding='utf-8').read()\nprint('total chars (no ws):', len(re.sub(r'\\s', '', t)))\nprint('chinese chars:', len(re.findall(r'[\\u4e00-\\u9fff]', t)))\n\" && rm -f \"%TEMP%/report_section3.txt\" && echo cleaned"]
